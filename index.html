<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GEE-Assist is a Windows desktop app that turns a plain-language request into a Google Earth Engine download: pick a dataset, draw an area, get a GeoTIFF." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/media/icon-light-64.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before React renders so the page never flashes.
      try {
        var t = localStorage.getItem("gee-assist-theme");
        if (["light", "dark-green", "dark-grey", "earth", "navy", "midnight", "seal-crimson", "ocean-teal"].indexOf(t) !== -1) {
          document.documentElement.setAttribute("data-theme", t);
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.setAttribute("data-theme", "midnight");
        }
      } catch (e) {}
    </script>
    <title>GEE-Assist</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
